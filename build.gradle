import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = 'dev.amado'
version = project.mod_version

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.24'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

def soundfontResources = layout.buildDirectory.dir('generated/soundfont')
def uprightUrl = 'https://freepats.zenvoid.org/Piano/UprightPianoKW/UprightPianoKW-small-SF2-20190703.7z'
def gmUrl = 'https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2'

tasks.register('prepareSoundfont') {
    group = 'build'
    description = 'Downloads and packages the upright and General MIDI SoundFonts.'
    outputs.files(soundfontResources.map { directory -> [
            directory.file('assets/minepiano/soundfont/piano.sf2'),
            directory.file('assets/minepiano/soundfont/generaluser.sf2')
    ] })

    doLast {
        File outputDirectory = soundfontResources.get().dir('assets/minepiano/soundfont').asFile
        outputDirectory.mkdirs()
        File upright = project.findProperty('soundfont') ? file(project.property('soundfont')) : null

        if (upright == null) {
            File archive = layout.buildDirectory.file('soundfont/UprightPianoKW-small-SF2-20190703.7z').get().asFile
            archive.parentFile.mkdirs()
            if (!archive.exists()) {
                try {
                    URLConnection connection = new URL(uprightUrl).openConnection()
                    connection.setRequestProperty('User-Agent', 'Mozilla/5.0')
                    connection.getInputStream().withCloseable { input -> archive.withOutputStream { it << input } }
                } catch (Exception failure) {
                    throw new GradleException("Failed to download upright SoundFont from ${uprightUrl}", failure)
                }
            }

            File extracted = layout.buildDirectory.dir('soundfont/extracted').get().asFile
            delete extracted
            extracted.mkdirs()
            if (!System.getenv('PATH').tokenize(File.pathSeparator).any { new File(it, '7z').canExecute() }) {
                throw new GradleException('run inside nix develop (p7zip)')
            }
            Process process = new ProcessBuilder('7z', 'x', '-y', archive.toString(), "-o${extracted}").inheritIO().start()
            if (process.waitFor() != 0) throw new GradleException('7z extraction failed')
            def soundfonts = fileTree(extracted) { include '**/*.sf2' }.files
            if (soundfonts.size() != 1) throw new GradleException("Expected exactly one .sf2, found ${soundfonts.size()}")
            upright = soundfonts.first()
        }

        File gm = project.findProperty('gmSoundfont') ? file(project.property('gmSoundfont')) : null
        if (gm == null) {
            gm = layout.buildDirectory.file('soundfont/GeneralUser-GS.sf2').get().asFile
            if (!gm.exists()) {
                try {
                    URLConnection connection = new URL(gmUrl).openConnection()
                    connection.setRequestProperty('User-Agent', 'Mozilla/5.0')
                    connection.getInputStream().withCloseable { input -> gm.withOutputStream { it << input } }
                } catch (Exception failure) {
                    throw new GradleException("Failed to download General MIDI SoundFont from ${gmUrl}", failure)
                }
            }
        }

        if (!upright.isFile()) throw new GradleException("Upright SoundFont not found: ${upright}")
        if (!gm.isFile()) throw new GradleException("General MIDI SoundFont not found: ${gm}")
        copy { from upright; into outputDirectory; rename { 'piano.sf2' } }
        copy { from gm; into outputDirectory; rename { 'generaluser.sf2' } }
    }
}

sourceSets.main.resources.srcDir(soundfontResources)
tasks.named('processResources') { dependsOn 'prepareSoundfont' }

tasks.register('downloadDevMods') {
    group = 'fabric'
    description = 'Downloads Simple Voice Chat for development runs.'
    doLast {
        File output = file('run/mods/voicechat-fabric-2.6.24+26.3.jar')
        output.parentFile.mkdirs()
        if (!output.exists()) {
            new URL('https://cdn.modrinth.com/data/9eGKb6K1/versions/OLnMVWXy/voicechat-fabric-2.6.24%2B26.3.jar').withInputStream { input -> output.withOutputStream { it << input } }
        }
        String actual = MessageDigest.getInstance('SHA-512').digest(Files.readAllBytes(output.toPath())).collect { String.format('%02x', it) }.join()
        if (actual != '414eb51967305fe7740d34016bc8e3e4e2fa1590e1278ad06bcdfa0687f65007b825d345dc09f79a992704a51ec93baf01fe727e0bbc32fdf506828b5a65d85a') {
            throw new GradleException('Simple Voice Chat SHA-512 mismatch')
        }
    }
}
